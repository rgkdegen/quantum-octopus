<script>
const W=1920,H=1080,T=28;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const C={ice:'#8ff0ff',cyan:'#3fd9e8',mag:'#ff4f9a',amb:'#ffb547',vio:'#9b7bff',grn:'#5ee6a0',red:'#ff3b5c',txt:'#e6fbff',dim:'#6f9aa3',dim2:'#3d5f66',panel:'rgba(4,18,22,0.82)',line:'#173c43'};
const MONO='JB',SANS='IN';
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ss=(a,b,x)=>{x=cl((x-a)/(b-a));return x*x*(3-2*x)};
const lerp=(a,b,k)=>a+(b-a)*k;
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function rr(x,y,w,h,r,c=ctx){c.beginPath();c.roundRect(x,y,w,h,r)}
function txt(s,x,y,{f=MONO,sz=14,w=400,c=C.txt,al='left',ls=0}={}){ctx.font=`${w} ${sz}px ${f}`;ctx.fillStyle=c;ctx.textAlign=al;ctx.textBaseline='alphabetic';ctx.letterSpacing=ls+'px';ctx.fillText(s,x,y);ctx.letterSpacing='0px'}
function tw(s,{f=MONO,sz=14,w=400,ls=0}={}){ctx.font=`${w} ${sz}px ${f}`;ctx.letterSpacing=ls+'px';const m=ctx.measureText(s).width;ctx.letterSpacing='0px';return m}
function glowSprite(col,rad){const s=document.createElement('canvas');s.width=s.height=rad*2;const g=s.getContext('2d');const gr=g.createRadialGradient(rad,rad,0,rad,rad,rad);gr.addColorStop(0,hexA(col,1));gr.addColorStop(0.2,hexA(col,0.4));gr.addColorStop(1,hexA(col,0));g.fillStyle=gr;g.fillRect(0,0,rad*2,rad*2);return s}
const GI=glowSprite('#8ff0ff',64),GM=glowSprite('#ff4f9a',64),GA=glowSprite('#ffb547',64),GW=glowSprite('#ffffff',64),GR=glowSprite('#ff3b5c',64);

// ---------------- timeline
const PH=[[0,'GENERATING'],[3,'SUPERPOSITION'],[8,'|ψ⟩ = α|0⟩ + β|1⟩'],[10,'QUANTUM TUNNELING'],[15,'ENTANGLED'],[20,'OBSERVER DETECTED'],[23.5,'COLLAPSED → |OCTO⟩']];
function phase(t){let k=0;for(let i=0;i<PH.length;i++)if(t>=PH[i][0])k=i;return k}

// ---------------- octopus model
const R=rng(11);const P=[];
function addSphereShell(cx,cy,cz,rx,ry,rz,n,k,fill=0){for(let i=0;i<n;i++){let u=R()*2-1,th=R()*6.283;const s=Math.sqrt(1-u*u);let r=R()<fill?Math.cbrt(R()):1+(R()-.5)*0.03;P.push({x:cx+s*Math.cos(th)*rx*r,y:cy+u*ry*r,z:cz+s*Math.sin(th)*rz*r,k,a:R(),b:R()})}}
addSphereShell(0,1.42,-0.55,0.64,0.8,0.64,7000,0,0.12); // mantle
addSphereShell(0,0.38,0.12,0.6,0.52,0.58,4200,1,0.15);   // head
const EYES=[[-0.5,0.55,0.34],[0.5,0.55,0.34]];
EYES.forEach(e=>{addSphereShell(e[0],e[1],e[2],0.19,0.19,0.19,700,2,0.3);
 for(let i=0;i<420;i++){const th=R()*6.283;const r=0.205+(R()-.5)*0.02;const ox=Math.sign(e[0])*0.06;P.push({x:e[0]+ox,y:e[1]+Math.sin(th)*r,z:e[2]+Math.cos(th)*r,k:3,a:R(),b:R()})}});
// arms
const ARMS=[];for(let i=0;i<8;i++){const a=(i+0.5)/8*6.283+0.0;const lift=[1.3,0.8,0.45,0.25,0.25,0.45,0.8,1.3][i];ARMS.push({a,lift,ph:R()*6.28,len:2.3+R()*0.5})}
function armPath(arm,t){// returns function u->[x,y,z,w]
 const pts=[];let rx=0.34,ry=0.0,th=-0.6;const N=40;const ds=arm.len/N;
 for(let i=0;i<=N;i++){const u=i/N;pts.push([rx,ry,u]);
  const curl=ss(0.5,1,u)*(1.6+arm.lift*1.4)+Math.sin(t*1.3+arm.ph+u*4)*0.18*u;
  const tgt=-0.25+arm.lift*0.35*ss(0,0.5,u)+curl;th=lerp(th,tgt,0.35);
  rx+=Math.cos(th)*ds;ry+=Math.sin(th)*ds;}
 return pts;
}
const ARMPTS=[];// per-arm point params
ARMS.forEach((arm,ai)=>{for(let i=0;i<1700;i++){const u=Math.pow(R(),0.85);ARMPTS.push({ai,u,th:R()*6.283,rr:1+(R()-.5)*0.08,a:R(),suck:R()<0.12})}});
const SNOW=[];for(let i=0;i<180;i++)SNOW.push({x:R(),y:R(),z:R(),s:R()});

// offscreen octopus
const OW=1000,OH=820,OX=500,OY=470,OS=148;
const O=document.createElement('canvas');O.width=OW;O.height=OH;const oc=O.getContext('2d');
const Osm=document.createElement('canvas');Osm.width=OW*0.4;Osm.height=OH*0.4;const osc=Osm.getContext('2d');
const TINT={};['vio','mag','ice'].forEach(k=>{const c=document.createElement('canvas');c.width=Osm.width;c.height=Osm.height;TINT[k]=c});

function drawOcto(t,opt){
 const {form=1,camo=0,yaw=0,squeeze=1,brains=0,brainCol=null}=opt;
 oc.setTransform(1,0,0,1,0,0);oc.clearRect(0,0,OW,OH);oc.globalCompositeOperation='lighter';
 const cy=Math.cos(yaw),sy=Math.sin(yaw),tl=0.22,ct=Math.cos(tl),st=Math.sin(tl);
 const breathe=1+0.035*Math.sin(t*2.2);
 function proj(x,y,z){x*=squeeze;const x1=x*cy-z*sy,z1=x*sy+z*cy;const y1=y*ct-z1*st,z2=y*st+z1*ct;const p=6/(6+z2);return[OX+x1*OS*p,OY-y1*OS*p,z2,p]}
 const camoCol=(x,y,z)=>{const n=Math.sin(x*9+t*3)*Math.sin(y*11-t*2)*Math.sin(z*7+t);return n>0.15?'255,150,80':n<-0.2?'255,80,150':'120,210,200'};
 for(const p of P){if(p.a>form)continue;let x=p.x,y=p.y,z=p.z;
  if(p.k===0){x*=breathe;z=-0.55+(z+0.55)*breathe;y=1.42+(y-1.42)*(1+0.02*Math.sin(t*2.2))}
  let col='150,236,255',al=0.22+0.3*p.b,sz=1.6;
  if(p.k===1){al=0.26+0.3*p.b}
  if(p.k===2){col='200,240,255';al=0.3}
  if(p.k===3){col='255,200,90';al=0.75;sz=1.8}
  if(camo>0&&p.k<2){col=camoCol(x,y,z);al*=1-0.3*camo}
  const q=proj(x,y,z);const d=cl(0.6+0.4*(-q[2]/1.5+0.5),0.35,1);
  oc.fillStyle=`rgba(${col},${al*d})`;oc.fillRect(q[0],q[1],sz*q[3],sz*q[3]);}
 const paths=ARMS.map(a=>armPath(a,t));
 for(const ap of ARMPTS){if(ap.a>form)continue;const arm=ARMS[ap.ai],pts=paths[ap.ai];const fi=ap.u*40,i0=Math.floor(fi),i1=Math.min(40,i0+1),k=fi-i0;
  const rx=lerp(pts[i0][0],pts[i1][0],k),ry=lerp(pts[i0][1],pts[i1][1],k);
  const w=(0.16*Math.pow(1-ap.u,0.9)+0.018)*ap.rr;
  const ca=Math.cos(arm.a),sa=Math.sin(arm.a);
  // tube cross-section: around tangent; approximate with offsets in (perp horizontal, vertical)
  const ox=Math.cos(ap.th)*w,oy=Math.sin(ap.th)*w;
  let x=ca*rx+(-sa)*ox,z=sa*rx+ca*ox,y=ry+oy;
  let col='150,236,255',al=0.3*(1-ap.u*0.35),sz=1.5;
  if(ap.suck&&ap.th>3.6&&ap.th<5.8){col='220,250,255';al=0.6}
  if(camo>0){col=camoCol(x,y,z);al*=1-0.3*camo}
  const q=proj(x,y,z);oc.fillStyle=`rgba(${col},${al})`;oc.fillRect(q[0],q[1],sz*q[3],sz*q[3]);}
 // nine brains glow
 const bpos=[[0,0.32,0.1]];ARMS.forEach((a,i)=>{const pts=paths[i];const p=pts[10];bpos.push([Math.cos(a.a)*p[0],p[1],Math.sin(a.a)*p[0]])});
 bpos.forEach((b,i)=>{const lit=brains>i?1:0;if(!lit&&brains<=0)return;const q=proj(...b);const col=brainCol?brainCol(i):(i===0?GM:GA);const s=(i===0?60:30)*(0.8+0.2*Math.sin(t*6+i))*(lit?1:0.35);oc.globalAlpha=lit?0.9:0.3;oc.drawImage(col,q[0]-s,q[1]-s,s*2,s*2);oc.globalAlpha=1});
 oc.globalCompositeOperation='source-over';
 return {proj,bpos};
}
function makeTints(){osc.clearRect(0,0,Osm.width,Osm.height);osc.drawImage(O,0,0,Osm.width,Osm.height);
 const hues={ice:'none',vio:'hue-rotate(70deg) saturate(1.3)',mag:'hue-rotate(140deg) saturate(1.6)'};
 for(const k in TINT){const c=TINT[k].getContext('2d');c.clearRect(0,0,Osm.width,Osm.height);c.filter=hues[k];c.drawImage(Osm,0,0);c.filter='none'}}

// ---------------- cryostat (silver)
function cryostat(t){
 const cx=300;ctx.save();
 // wires from top
 for(let i=0;i<22;i++){const x0=cx-150+i*14;ctx.strokeStyle=i%3?'rgba(170,200,205,0.55)':'rgba(255,150,90,0.55)';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x0,-10);ctx.quadraticCurveTo(x0+(i-11)*3,50,cx-170+i*16,100);ctx.stroke()}
 const plates=[[110,190],[235,170],[355,150],[470,128],[575,104]];
 const metal=(x,w,y,h)=>{const g=ctx.createLinearGradient(x-w,0,x+w,0);g.addColorStop(0,'#2c3b40');g.addColorStop(0.25,'#c9d6da');g.addColorStop(0.45,'#f2fbfd');g.addColorStop(0.7,'#7d9196');g.addColorStop(1,'#1f2b2f');return g};
 // rods + coils between plates
 for(let p=0;p<plates.length-1;p++){const [y0,w0]=plates[p],[y1,w1]=plates[p+1];
  for(let r=0;r<11;r++){const f=r/10;const xa=cx-w0*0.88+f*w0*1.76,xb=cx-w1*0.88+f*w1*1.76;const shade=0.35+0.65*Math.sin(f*Math.PI);
   ctx.strokeStyle=`rgba(${190*shade+40|0},${210*shade+40|0},${215*shade+40|0},0.95)`;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(xa,y0+10);ctx.lineTo(xb,y1);ctx.stroke()}
  // coils
  for(let k=0;k<6;k++){const f=(k+0.5)/6;const x=cx-w0*0.7+f*w0*1.4,ym=lerp(y0,y1,0.5);ctx.strokeStyle=k%2?'rgba(255,150,90,0.8)':'rgba(120,220,235,0.8)';ctx.lineWidth=1.4;ctx.beginPath();
   for(let s=0;s<=30;s++){const yy=y0+14+s/30*(y1-y0-18);const xx=lerp(x,cx-(w1*0.7)+f*w1*1.4,s/30)+Math.sin(s*1.3+k)*6;s?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke();
   ctx.beginPath();ctx.arc(x+4,ym,7,0,7);ctx.strokeStyle='rgba(255,170,110,0.7)';ctx.stroke()}
 }
 // plates
 plates.forEach(([y,w],i)=>{ctx.fillStyle=metal(cx,w,y,14);ctx.beginPath();ctx.ellipse(cx,y+12,w,22,0,0,Math.PI);ctx.lineTo(cx-w,y);ctx.ellipse(cx,y,w,22,0,Math.PI,0,true);ctx.closePath();ctx.fill();
  const g2=ctx.createLinearGradient(cx-w,0,cx+w,0);g2.addColorStop(0,'#55686d');g2.addColorStop(0.45,'#e9f6f8');g2.addColorStop(1,'#3a4a4f');ctx.fillStyle=g2;ctx.beginPath();ctx.ellipse(cx,y,w,22,0,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;ctx.stroke();
  for(let l=0;l<5;l++){const a=l/5*Math.PI+0.3;const lx=cx+Math.cos(a)*w*0.9,ly=y+12+Math.sin(a)*14;const on=Math.sin(t*4+l*2+i)>0.2;ctx.fillStyle=on?(l%2?C.cyan:C.mag):'#2b3a3e';ctx.beginPath();ctx.arc(lx,ly,2.4,0,7);ctx.fill()}});
 // stem
 const stem=[[600,90,40],[640,74,26],[668,60,40],[710,44,16]];
 stem.forEach(([y,w,h])=>{ctx.fillStyle=metal(cx,w,y,h);ctx.fillRect(cx-w,y,w*2,h);for(let k=0;k<h;k+=6){ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(cx-w,y+k,w*2,1.5)}});
 ctx.fillStyle='#d8eef2';ctx.fillRect(cx-26,726,52,8);
 // emitter
 ctx.globalCompositeOperation='lighter';const pulse=0.8+0.2*Math.sin(t*5);ctx.globalAlpha=pulse;ctx.drawImage(GI,cx-70,745-70,140,140);ctx.drawImage(GW,cx-22,745-22,44,44);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 ctx.restore();
}

// ---------------- strands
const STR=[];const RS=rng(5);for(let i=0;i<46;i++){STR.push({x0:300+(RS()-.5)*240,y0:150+RS()*560,x1:1370+RS()*40,y1:130+RS()*700,c1:[700+RS()*300,100+RS()*800],c2:[1000+RS()*300,100+RS()*800],col:[C.cyan,C.vio,C.mag,C.ice][i%4],ph:RS()*6,sp:0.05+RS()*0.08})}
function bez(s,u,t){const w=Math.sin(t*0.6+s.ph)*30;const a=[s.x0,s.y0],b=[s.c1[0],s.c1[1]+w],c=[s.c2[0],s.c2[1]-w],d=[s.x1,s.y1];const m=1-u;return[m*m*m*a[0]+3*m*m*u*b[0]+3*m*u*u*c[0]+u*u*u*d[0],m*m*m*a[1]+3*m*m*u*b[1]+3*m*u*u*c[1]+u*u*u*d[1]]}
function strands(t,k){ctx.save();ctx.globalCompositeOperation='lighter';
 for(const s of STR){ctx.strokeStyle=hexA(s.col,0.10*k);ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=40;i++){const p=bez(s,i/40,t);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.stroke();
  for(let j=0;j<2;j++){const u=(t*s.sp+j*0.5+s.ph)%1;const p=bez(s,u,t);ctx.globalAlpha=0.8*k;ctx.drawImage(s.col===C.mag?GM:GI,p[0]-6,p[1]-6,12,12);ctx.globalAlpha=1}}
 ctx.restore()}

// ---------------- pad
function pad(t,cx,cy,k=1){ctx.save();ctx.globalCompositeOperation='lighter';
 // light cone
 const g=ctx.createLinearGradient(0,cy-520,0,cy);g.addColorStop(0,'rgba(80,220,240,0)');g.addColorStop(1,`rgba(80,220,240,${0.16*k})`);ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx-190,cy-520);ctx.lineTo(cx+190,cy-520);ctx.lineTo(cx+330,cy);ctx.lineTo(cx-330,cy);ctx.closePath();ctx.fill();
 const rings=[[340,58,2.2,0.9],[300,50,1.2,0.6],[245,40,1.5,0.5],[185,30,1,0.45],[120,19,1,0.4]];
 rings.forEach(([rx,ry,lw,al],i)=>{ctx.strokeStyle=`rgba(120,235,250,${al*k})`;ctx.lineWidth=lw;if(i===2||i===4){ctx.setLineDash([14,10]);ctx.lineDashOffset=-t*30*(i===2?1:-1)}ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,7);ctx.stroke();ctx.setLineDash([])});
 const gp=ctx.createRadialGradient(cx,cy,10,cx,cy,340);gp.addColorStop(0,`rgba(120,235,250,${0.35*k})`);gp.addColorStop(1,'rgba(120,235,250,0)');ctx.fillStyle=gp;ctx.save();ctx.translate(cx,cy);ctx.scale(1,58/340);ctx.beginPath();ctx.arc(0,0,340,0,7);ctx.fill();ctx.restore();
 ctx.restore()}

// ---------------- processes
const PROC=[
 ['qpu.boot','fid','err',C.cyan,0],['entangle brain0↔arm8','fid','err',C.vio,15],
 ['quantum.compile','ops','amp',C.amb,0.5],['bell.pair |Φ+⟩','ops','amp',C.mag,15.5],
 ['particle.stream','T2','shots',C.mag,0],['error.correct','T2','shots',C.grn,-1],
 ['superpose ×256','gates','load',C.vio,3],['decohere.watch','gates','load',C.red,20],
 ['gate · H⊗9','fid','err',C.amb,2.8],['observer.detect','fid','err',C.red,20],
 ['pulse.shaper','ops','amp',C.cyan,8],['camo.mask','ops','amp',C.amb,20.3],
 ['squeeze.sim','T2','shots',C.grn,10],['measure()','T2','shots',C.amb,23.3],
 ['barrier · V₀','gates','load',C.amb,10],['ψ.collapse','gates','load',C.cyan,23.5]];
function procState(i,t){const p=PROC[i];const st=p[4];if(st<0)return 'RUN';if(t<st)return 'IDLE';
 if((i===7||i===9)&&t<23.5)return 'ALERT';if(i===11&&t<23.5)return 'RUN';
 if(t<st+4)return 'RUN';return 'OK'}
function procPanel(t){const X=1360,Y=136,cw=255,ch=76,g=12;
 txt('AI ORCHESTRATOR · 16 LIVE PROCESSES',X+4,Y-8,{sz:13,w:500,ls:3.5,c:'#9fd4dc'});
 ctx.fillStyle=Math.sin(t*5)>0?C.red:'#5a1a24';ctx.beginPath();ctx.arc(X+tw('AI ORCHESTRATOR · 16 LIVE PROCESSES',{sz:13,w:500,ls:3.5})+16,Y-13,4,0,7);ctx.fill();
 const R2=rng(99);
 for(let i=0;i<16;i++){const col=i%2,row=i>>1;const x=X+col*(cw+g),y=Y+row*(ch+6);const yy0=y;const p=PROC[i];const s=procState(i,t);
  const hl=s==='RUN'||s==='ALERT';rr(x,y,cw,ch,4);ctx.fillStyle='rgba(3,16,20,0.88)';ctx.fill();ctx.strokeStyle=s==='ALERT'?C.red:hl?hexA(p[3],0.9):'rgba(80,120,130,0.35)';ctx.lineWidth=hl?1.5:1;ctx.stroke();
  rr(x+1,y+1,cw-2,20,[4,4,0,0]);ctx.fillStyle=s==='ALERT'?hexA(C.red,0.35):hexA(p[3],0.28);ctx.fill();
  txt(p[0],x+8,y+15,{sz:12,w:500,c:'#eafcff'});
  const sc=s==='ALERT'?C.red:s==='RUN'?'#ffffff':s==='OK'?'#cfeff3':'#7ea1a8';
  txt((hl?'● ':'')+s,x+cw-8,y+15,{sz:11,w:700,c:sc,al:'right'});
  for(let m=0;m<2;m++){const yy=y+38+m*18;const base=R2();const v=cl(base*0.6+0.25+(t>p[4]&&p[4]>=0||p[4]<0?0.15*Math.sin(t*(1.5+base)+i+m):-0.2),0.05,0.98);
   txt(m?p[2]:p[1],x+8,yy+4,{sz:11,c:'#9cc2c9'});
   ctx.fillStyle='rgba(120,160,170,0.18)';ctx.fillRect(x+52,yy-3,128,5);ctx.fillStyle=s==='ALERT'?C.red:p[3];ctx.fillRect(x+52,yy-3,128*v,5);
